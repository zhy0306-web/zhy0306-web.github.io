<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#667eea" />
  <title>漳州一中 · 八年12班交流论坛</title>
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/glass.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="images/logo.png" />
</head>
<body data-theme="light">
  <!-- 动态渐变背景 -->
  <div class="bg-gradient" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <!-- 顶部导航 -->
  <header id="navbar" class="navbar glass-card">
    <div class="nav-inner">
      <a href="#/" class="nav-brand" data-link>
        <img src="images/logo.png" alt="漳州一中校徽" class="brand-icon" />
        <span class="brand-text">
          <span class="brand-school">漳州一中</span>
          <span class="brand-class">八年12班</span>
        </span>
      </a>

      <nav class="nav-links" id="navLinks">
        <button class="nav-link" data-route="/" onclick="Router.navigate('/')">首页</button>
        <button class="nav-link" data-route="/board" onclick="Router.navigate('/board')">板块</button>
        <button class="nav-link" data-route="/explore" onclick="Router.navigate('/explore')">广场</button>
        <button class="nav-link" data-route="/ranking" onclick="Router.navigate('/ranking')">排行</button>
      </nav>

      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" title="切换主题">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <button class="icon-btn" id="searchBtn" title="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>

        <span id="navUserArea"></span>

        <button class="icon-btn menu-btn" id="menuBtn" title="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- 移动端菜单（已删除） -->
  </header>

  <!-- 搜索框 -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-box glass-card">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="搜索帖子、用户、板块..." />
      <button class="icon-btn" id="searchClose">✕</button>
    </div>
    <div class="search-results glass-card" id="searchResults"></div>
  </div>

  <!-- 主内容区 -->
  <main id="app" class="app-main"></main>

  <!-- 浮动操作按钮 -->
  <button class="fab" id="fab" title="发布新帖">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- 模态容器 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal glass-card" id="modalContent"></div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 底部 -->
  <footer class="app-footer glass-card">
    <div class="footer-inner">
      <span><img src="images/logo.png" alt="校徽" class="footer-logo" /> 漳州一中 · 八年12班</span>
      <span>© 2026 交流论坛 · 由 詹航瑜 开发</span>
      <a href="https://github.com/zhy0306-web/zzyz-class12-forum" target="_blank" rel="noopener" class="footer-github" title="GitHub 开源项目">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2.2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.32-1.27-1.67-1.27-1.67-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.02 1.75 2.68 1.24 3.33.95.1-.74.4-1.24.72-1.53-2.55-.29-5.24-1.27-5.24-5.65 0-1.25.45-2.27 1.19-3.07-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.17 1.18a10.98 10.98 0 015.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.58.23 2.75.11 3.04.74.8 1.19 1.82 1.19 3.07 0 4.39-2.69 5.36-5.26 5.64.41.35.77 1.05.77 2.12v3.14c0 .31.21.67.8.56A11.51 11.51 0 0023.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
        <span>View on GitHub</span>
      </a>
    </div>
  </footer>

  <!-- Supabase CDN（云数据库，可选）-->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
  <!-- Supabase 配置与初始化（在 store.js 之前加载）-->
  <script src="js/supabase.js"></script>
  <!-- JavaScript 模块 -->
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forum.js"></script>
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
